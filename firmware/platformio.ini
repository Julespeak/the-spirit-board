[platformio]
default_envs = spirit
extra_configs =
  platformio_override.ini

[env]
; Use pioarduino for Arduino-ESP32 v3.x support on ESP32-C6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

[env:spirit]
board = esp32-c6-devkitc-1
build_flags =
    -D TARGET_SPIRIT
    ${credentials.build_flags}
upload_protocol = espota
upload_port = TheSPIRITBoard.local

[env:spirit_usb]
board = esp32-c6-devkitc-1
build_flags =
    -D TARGET_SPIRIT
    ${credentials.build_flags}
upload_protocol = esptool
upload_port = /dev/ttyUSB0

[env:feather]
board = adafruit_feather_esp32c6
build_flags =
    -D TARGET_FEATHER
    ${credentials.build_flags}
upload_protocol = espota
upload_port = 192.168.66.243
upload_flags =
  --auth=admin
  --spiffs

[env:feather_usb]
board = adafruit_feather_esp32c6
build_flags =
    -D TARGET_FEATHER
    ${credentials.build_flags}
upload_protocol = esptool
upload_port = /dev/ttyACM0

; Default credentials (empty) - override in platformio_override.ini
[credentials]
build_flags =
